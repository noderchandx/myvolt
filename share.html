<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শেয়ার করা ফাইল — My Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <svg class="dial" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#16233F"/><circle cx="50" cy="50" r="24" fill="none" stroke="#D4A537" stroke-width="6"/></svg>
      My Vault
    </a>
  </div>
</header>

<div class="share-wrap" id="loadingWrap">
  <div class="spinner"></div>
</div>

<div class="share-wrap" id="notFoundWrap" style="display:none;">
  <div class="share-card">
    <div class="thumb-lg">🚫</div>
    <h2 style="font-family:var(--font-display); margin-bottom:8px;">লিংকটি খুঁজে পাওয়া যায়নি</h2>
    <p style="color:var(--text-muted); font-size:.9rem;">এই শেয়ার লিংকটি সঠিক নয় অথবা মালিক এটি মুছে ফেলেছেন।</p>
    <a href="index.html" class="btn btn-primary" style="margin-top:16px;">হোমে ফিরে যান</a>
  </div>
</div>

<div class="share-wrap" id="fileWrap" style="display:none;">
  <div class="share-card">
    <div class="thumb-lg" id="fileThumb"></div>
    <h2 style="font-family:var(--font-display); margin-bottom:6px;" id="fileName"></h2>
    <p style="color:var(--text-muted); font-size:.85rem; margin-bottom:20px;" id="fileMeta"></p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-primary" id="downloadBtn">⬇️ ডাউনলোড</button>
    </div>
    <p style="margin-top:18px; font-size:.78rem; color:var(--text-muted);">🔒 My Vault দিয়ে শেয়ার করা হয়েছে</p>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/utils.js"></script>
<script src="js/share.js"></script>
</body>
</html>
