<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome Core Icons এর জন্য (ডাউনলোড/ডিলিট বাটনের আইকন) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</head>
<body>
    <!-- ড্যাশবোর্ড নেভিগেশন বার -->
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand-logo">My Vault 🔒</span>
            <span id="current-path" class="path-breadcumb">Root /</span>
        </div>
        <div class="nav-right">
            <div class="user-profile-nav">
                <img id="nav-profile-img" src="https://via.placeholder.com/40" alt="Profile">
                <span id="nav-user-name">ইউজার নাম</span>
            </div>
            <button id="btn-logout" class="btn-danger"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- সাইডবার: স্টোরেজ ট্র্যাকার এবং প্রোফাইল সেটিং -->
        <aside class="sidebar">
            <div class="storage-card">
                <h3>স্টোরেজ স্ট্যাটাস</h3>
                <div class="progress-container">
                    <div id="storage-progress" class="progress-bar"></div>
                </div>
                <p id="storage-text">Calculated: 0 MB / 1 GB</p>
            </div>
            
            <div class="quick-actions">
                <!-- ফাইল আপলোড ফর্ম -->
                <label for="file-upload-input" class="btn-upload">
                    <i class="fas fa-cloud-upload-alt"></i> কুইক আপলোড
                </label>
                <input type="file" id="file-upload-input" style="display:none;">
                <div id="upload-progress-container" class="hidden">
                    <span id="upload-pct">০%</span> আপলোড হচ্ছে...
                </div>
                
                <button id="btn-create-folder" class="btn-secondary"><i class="fas fa-folder-plus"></i> নতুন ফোল্ডার</button>
            </div>
        </aside>

        <!-- মেইন কন্টেন্ট এরিয়া: ফাইল এবং ফোল্ডার ভিউ -->
        <main class="main-content">
            <div class="action-bar">
                <input type="text" id="search-input" placeholder="ফাইল বা ফোল্ডার খুঁজুন...">
                <div class="view-toggles">
                    <button id="btn-view-grid" class="active"><i class="fas fa-th-large"></i></button>
                    <button id="btn-view-list"><i class="fas fa-list"></i></button>
                </div>
            </div>

            <!-- ফাইল ও ফোল্ডার রেন্ডার করার গ্রিড -->
            <div id="vault-items-grid" class="dashboard-grid">
                <!-- জাভাস্ক্রিপ্ট দিয়ে ফোল্ডার এবং ফাইল কার্ড এখানে পুশ করা হবে -->
                <!-- উদাহরণ (ফোল্ডার কার্ড):
                <div class="card folder-card">
                    <i class="fas fa-folder folder-icon"></i>
                    <h4>ব্যক্তিগত ছবি</h4>
                    <button class="btn-icon"><i class="fas fa-ellipsis-v"></i></button>
                </div> 
                -->
            </div>
        </main>
    </div>

    <!-- ফাইল প্রিভিউ এবং শেয়ার অপশনের জন্য মোডাল উইন্ডো -->
    <div id="preview-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal" id="close-preview">&times;</span>
            <h3 id="preview-title">ফাইলের নাম</h3>
            <div id="preview-body">
                <!-- ছবি/পিডিএফ প্রিভিউ লোড হবে এখানে -->
            </div>
            <div class="modal-actions">
                <button id="btn-modal-download" class="btn-primary"><i class="fas fa-download"></i> ডাউনলোড</button>
                <button id="btn-modal-share" class="btn-secondary"><i class="fas fa-share-alt"></i> শেয়ার লিংক</button>
                <button id="btn-modal-delete" class="btn-danger"><i class="fas fa-trash"></i> ডিলিট</button>
            </div>
        </div>
    </div>
</body>
</html>
