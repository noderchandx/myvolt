<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File - My Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="js/app.js"></script>
    <script>
        // জাভাস্ক্রিপ্ট দিয়ে URL প্যারামিটার থেকে ফাইলের তথ্য রিড করার মেকানিজম
        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');
            
            if (!fileUrl) {
                document.getElementById('shared-container').innerHTML = `<h3>ফাইলটি খুঁজে পাওয়া যায়নি বা লিংকটি ভুল!</h3>`;
                return;
            }

            // ডাইনামিকলি ডাউনলোডের বাটন এবং ফাইল প্রিভিউ সেট করা
            const downloadBtn = document.getElementById('btn-download-shared');
            downloadBtn.href = fileUrl;

            // ফাইলের এক্সটেনশন চেক করে ডিসপ্লে দেওয়া (সহজ লজিক)
            const previewDiv = document.getElementById('shared-preview');
            if(fileUrl.includes('.jpg') || fileUrl.includes('.png') || fileUrl.includes('.jpeg') || fileUrl.includes('alt=media')) {
                previewDiv.innerHTML = `<img src="${fileUrl}" alt="Shared Image" class="responsive-preview-img">`;
            } else {
                previewDiv.innerHTML = `<div class="file-placeholder"><i class="fas fa-file-alt fa-5x"></i><p>এই ফাইল ফরম্যাটটির সরাসরি প্রিভিউ সম্ভব নয়। নিচে থেকে ডাউনলোড করে নিন।</p></div>`;
            }
        });
    </script>
</head>
<body class="light-mode shared-body">
    <div class="shared-wrapper">
        <header class="shared-header">
            <h2>My Vault 🔒 <span style="font-size: 14px; font-weight: normal;">- Shared File View</span></h2>
        </header>

        <main id="shared-container" class="card shared-card">
            <div id="shared-preview" class="shared-preview-box">
                <!-- ফাইল ইমেজ বা আইকন এখানে লোড হবে -->
                <i class="fas fa-spinner fa-spin fa-3x"></i> Loading File...
            </div>
            
            <div class="shared-info">
                <p class="security-notice"><i class="fas fa-shield-alt"></i> এই ফাইলটি My Vault ক্লাউড স্টোরেজ দ্বারা সুরক্ষিতভাবে শেয়ার করা হয়েছে।</p>
                <!-- সরাসরি ডিরেক্ট স্টোরেজ লিংক ডাউনলোড করার বাটন -->
                <a id="btn-download-shared" href="#" download target="_blank" class="btn-primary btn-block text-center">
                    <i class="fas fa-download"></i> ফাইলটি ডাউনলোড করুন
                </a>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 My Vault. All Rights Reserved.</p>
        </footer>
    </div>
</body>
</html>
