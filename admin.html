<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - My Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/admin.js"></script>
</head>
<body>
    <header class="admin-header">
        <h2>My Vault - অ্যাডমিন কন্ট্রোল প্যানেল 🛠️</h2>
        <a href="dashboard.html" class="btn-secondary">ইউজার ড্যাশবোর্ড</a>
    </header>

    <main class="container">
        <!-- সিস্টেমের সামগ্রিক স্ট্যাটাস কার্ডস -->
        <section class="admin-stats-grid">
            <div class="card stat-card">
                <h3>মোট ইউজার</h3>
                <p id="total-users">০ জন</p>
            </div>
            <div class="card stat-card">
                <h3>মোট আপলোডকৃত ফাইল</h3>
                <p id="total-files">০ টি</p>
            </div>
            <div class="card stat-card">
                <h3>সর্বমোট ব্যবহৃত স্টোরেজ</h3>
                <p id="total-sys-storage">0 GB</p>
            </div>
        </section>

        <!-- ইউজার ম্যানেজমেন্ট টেবিল -->
        <section class="user-management-section card">
            <h3>ইউজার তালিকা ও অ্যাকশন</h3>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>প্রোফাইল</th>
                            <th>নাম</th>
                            <th>ইমেইল</th>
                            <th>মোবাইল নম্বর</th>
                            <th>ব্যবহৃত স্টোরেজ</th>
                            <th>স্ট্যাটাস</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-rows">
                        <!-- ফায়ারস্টোর থেকে ডাইনামিক ডেটা আসবে এখানে -->
                        <!-- উদাহরণ:
                        <tr>
                            <td><img src="https://via.placeholder.com/30" class="table-img"></td>
                            <td>রাকিব আহমেদ</td>
                            <td>rakib@mail.com</td>
                            <td>017XXXXXXXX</td>
                            <td>450 MB</td>
                            <td><span class="status-badge active">Active</span></td>
                            <td><button class="btn-danger btn-sm">Block</button></td>
                        </tr>
                        -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
